<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>パスワードの再設定</title>
  </head>
  <body>
    <h2>パスワードの再設定</h2>

    <p>
      次のリンクから新しいパスワードを設定してください。
    </p>

    <p>
      <a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=%2Fclub-login%2Freset-password">
        パスワードを再設定する
      </a>
    </p>

    <p>
      心当たりがない場合は、このメールを無視してください。
    </p>
  </body>
</html>
